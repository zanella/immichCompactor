{#include base.html}
    {#title}Assets — {name}{/title}

    {#body}
        <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-100">
            <a href="/" class="text-indigo-600 hover:underline text-sm">&larr; Back to users</a>

            <!-- HTMX loads the status fragment, which then self-polls while running -->
            <div id="asset-refresh"
                 hx-get="/users/{id}/assets/status"
                 hx-trigger="load"
                 hx-swap="outerHTML"></div>

            <!-- Queued assets list (loaded via HTMX) -->
            <div id="assets-list"
                 hx-get="/users/{id}/assets/queued"
                 hx-trigger="load"
                 hx-swap="outerHTML">
                <div class="mt-6 animate-pulse text-gray-400 text-sm">Loading queued assets…</div>
            </div>
        </div>
    {/body}
{/include}
